apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
     metadata:
       labels:
         app: minecraft
     spec:
       containers:
       - name: minecraft
         image: itzg/minecraft-server
         env:
         - name: EULA
           value: "TRUE"
         ports:
         - containerPort: 25565
